name: Build & Deploy (Web + Desktop)

on:
  push:
    branches:
      - release
      - 'release/*'

permissions:
  contents: write   # ✅ tag, release 업로드에 필요

jobs:
  prepare_and_web:
    if: github.ref_type == 'branch'   # 태그 푸시로는 재실행 방지
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'

      - name: Pub get
        run: flutter pub get
        working-directory: ./zae_labeler

      - name: Derive version & tag from pubspec.yaml
        id: meta
        run: |
          VERSION=$(grep -E '^version:' zae_labeler/pubspec.yaml | sed -E 's/version:\s*([^ ]+)/\1/')
          TAG="v${VERSION%%+*}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping tag creation."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Insert GA Tag
        working-directory: ./zae_labeler
        env:
          GA_TRACKING_ID: ${{ secrets.GA_TAG_WEB }}
        run: |
          cp web/index.template.html web/index.html
          echo "Injecting GA ID: $GA_TRACKING_ID"
          GA_SCRIPT="<script async src='https://www.googletagmanager.com/gtag/js?id=$GA_TRACKING_ID'></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','$GA_TRACKING_ID');</script>"
          awk -v ga_tag="$GA_SCRIPT" '{gsub("<!-- GOOGLE_ANALYTICS -->", ga_tag)}1' web/index.template.html > web/index.html

      - name: Build Web (prod)
        run: flutter build web --release --dart-define=FLAVOR=production
        working-directory: ./zae_labeler

      - run: npm install -g firebase-tools

      - name: Firebase Deploy (prod)
        run: firebase deploy --only hosting:prod
        working-directory: ./zae_labeler
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Create/ensure GitHub Release (empty)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Desktop/Web release $TAG"

  desktop:
    needs: prepare_and_web
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'

      - name: Enable desktop
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) flutter config --enable-windows-desktop ;;
            macOS)   flutter config --enable-macos-desktop   ;;
            Linux)   flutter config --enable-linux-desktop    ;;
          esac

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev zip

      - name: Pub get
        run: flutter pub get
        working-directory: ./zae_labeler

      - name: Build desktop
        shell: bash
        working-directory: ./zae_labeler
        run: |
          case "$RUNNER_OS" in
            Windows) flutter build windows --release --dart-define=FLAVOR=production ;;
            macOS)   flutter build macos   --release --dart-define=FLAVOR=production ;;
            Linux)   flutter build linux   --release --dart-define=FLAVOR=production ;;
          esac

      - name: Package artifact
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -Command "Compress-Archive -Path 'zae_labeler\\build\\windows\\x64\\runner\\Release\\*' -DestinationPath 'zae_labeler\\build\\windows\\app-windows.zip'"
            echo "ART=zae_labeler/build/windows/app-windows.zip" >> $GITHUB_ENV
          elif [ "${{ runner.os }}" = "macOS" ]; then
            APP_PATH=$(ls -d zae_labeler/build/macos/Build/Products/Release/*.app | head -n1)
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "zae_labeler/build/macos/app-macos.zip"
            echo "ART=zae_labeler/build/macos/app-macos.zip" >> $GITHUB_ENV
          else
            zip -r zae_labeler/build/linux/app-linux.zip zae_labeler/build/linux/x64/release/bundle
            echo "ART=zae_labeler/build/linux/app-linux.zip" >> $GITHUB_ENV
          fi

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare_and_web.outputs.tag }}"
          gh release upload "$TAG" "$ART" --clobber
